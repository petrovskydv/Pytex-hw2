services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "7432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  payment-api:
    build: ./mock_apis/payment
    ports:
      - "9001:9001"

  protection-api:
    build: ./mock_apis/protection
    ports:
      - "9002:9002"

  redis:
    image: redis:7-alpine
    ports:
      - "7379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build: .
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: &app-environment
      DATABASE__URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      REDIS__URL: redis://redis:6379/0
      EXTERNAL_APIS__PAYMENT_API_URL: http://payment-api:9001
      EXTERNAL_APIS__PROTECTION_API_URL: http://protection-api:9002
      BOOKING__BOOKING_TTL_MINUTES: 15
      TASKIQ__BROKER_URL: redis://redis:6379/1
      TASKIQ__REPORTS_DIRECTORY: /app/reports
      TASKIQ__PROTECTION_RETRY_DELAY_SECONDS: 5
      KAFKA__BOOTSTRAP_SERVERS: kafka:19092
      KAFKA__TOPIC: tickets.purchased
      KAFKA__LINGER_MS: 75
      KAFKA__CONSUMER_GROUP: payment-monitor
      KAFKA__MAX_RECORDS: 10
      KAFKA__BATCH_TIMEOUT_MS: 500
      KAFKA__WEBSOCKET_SEND_TIMEOUT_SECONDS: 2
      PURCHASE_GENERATOR__INTERVAL_SECONDS: 0.05
      PURCHASE_GENERATOR__EVENT_ID_MAX: 5
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
    depends_on: &runtime-dependencies
      migrate:
        condition: service_completed_successfully
      payment-api:
        condition: service_started
      protection-api:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  monitoring:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    command: ["uv", "run", "--no-sync", "uvicorn", "monitoring.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE__URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      KAFKA__BOOTSTRAP_SERVERS: kafka:19092
      KAFKA__TOPIC: tickets.purchased
      KAFKA__CONSUMER_GROUP: payment-monitor
    ports:
      - "8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  worker-reports:
    build: .
    command:
      - uv
      - run
      - --no-sync
      - taskiq
      - worker
      - --workers
      - "2"
      - --max-async-tasks
      - "1"
      - --max-threadpool-threads
      - "1"
      - app.background.brokers:reports_broker
      - app.background.jobs
    environment: *app-environment
    volumes:
      - ./reports:/app/reports
    depends_on: *runtime-dependencies

  worker-cleanup:
    build: .
    command:
      - uv
      - run
      - --no-sync
      - taskiq
      - worker
      - --workers
      - "1"
      - --max-async-tasks
      - "1"
      - app.background.brokers:cleanup_broker
      - app.background.jobs
    environment: *app-environment
    depends_on: *runtime-dependencies

  worker-insurance:
    build: .
    command:
      - uv
      - run
      - --no-sync
      - taskiq
      - worker
      - --workers
      - "1"
      - --max-async-tasks
      - "10"
      - app.background.brokers:insurance_broker
      - app.background.jobs
    environment: *app-environment
    depends_on: *runtime-dependencies

  scheduler:
    build: .
    command:
      - uv
      - run
      - --no-sync
      - taskiq
      - scheduler
      - --skip-first-run
      - app.background.brokers:scheduler
      - app.background.jobs
    environment: *app-environment
    depends_on: *runtime-dependencies

volumes:
  postgres_data:
