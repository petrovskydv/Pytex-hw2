name: Verify Kafka infrastructure

on:
  push:
    branches: [hw-5]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hw-5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --python 3.13 --frozen
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Start Kafka infrastructure
        run: docker compose up -d kafka kafka-init kafka-ui
      - name: Verify kafka-init and topic
        run: |
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -q kafka-init))" = "0"
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:19092 \
            --describe --topic tickets.purchased | tee /tmp/topic.txt
          grep -q 'PartitionCount: 2' /tmp/topic.txt
          grep -q 'ReplicationFactor: 1' /tmp/topic.txt
      - name: Wait for Kafka UI
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs kafka-ui
          exit 1
      - run: uv run pytest
      - name: Start full application stack
        run: docker compose up -d --build
      - name: Wait for APIs
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null && curl --fail --silent http://127.0.0.1:8001/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs app monitoring kafka kafka-init migrate
          exit 1
      - name: Verify live pipeline
        run: |
          uv run python - <<'PY'
          import asyncio
          import json
          import websockets

          async def main() -> None:
              async with websockets.connect('ws://127.0.0.1:8001/ws/payments') as websocket:
                  payload = json.loads(await asyncio.wait_for(websocket.recv(), timeout=10))
              assert payload['type'] == 'payment_activity'
              assert payload['items']

          asyncio.run(main())
          PY
      - name: Verify monitoring persistence
        run: |
          rows=$(docker compose exec -T db psql -U postgres -d postgres -tAc 'select count(*) from event_payment_activity')
          test "$rows" -gt 0
      - name: Stop stack
        if: always()
        run: docker compose down -v
