name: Verify HW5 database structure

on:
  push:
    branches: [hw-5]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hw-5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --python 3.13 --frozen
      - run: cp .env.example .env
      - run: uv run ruff check monitoring/main.py monitoring/infrastructure/database migrations/env.py tests/test_monitoring_persistence.py
      - run: uv run ruff format --check monitoring/main.py monitoring/infrastructure/database migrations/env.py tests/test_monitoring_persistence.py
      - run: uv run pytest tests/test_monitoring_persistence.py tests/test_monitoring_service.py tests/test_monitoring_kafka_batches.py tests/test_monitoring_websocket.py tests/test_monitoring_websocket_shutdown.py tests/test_monitoring_aggregation.py
      - run: uv run pytest
      - run: docker compose config --quiet
      - name: Start application stack
        run: docker compose up -d --build db redis kafka payment-api protection-api migrate app monitoring
      - name: Wait for services
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null && curl --fail --silent http://127.0.0.1:8001/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs app monitoring kafka migrate
          exit 1
      - name: Verify real WebSocket delivery
        run: |
          uv run python - <<'PY'
          import asyncio
          import json
          import websockets

          async def main() -> None:
              async with (
                  websockets.connect("ws://127.0.0.1:8001/ws/payments") as first,
                  websockets.connect("ws://127.0.0.1:8001/ws/payments") as second,
              ):
                  messages = await asyncio.gather(
                      asyncio.wait_for(first.recv(), timeout=10),
                      asyncio.wait_for(second.recv(), timeout=10),
                  )
              for raw in messages:
                  payload = json.loads(raw)
                  assert payload["type"] == "payment_activity"
                  assert payload["items"]
              print("database structure e2e PASS")

          asyncio.run(main())
          PY
      - name: Stop stack
        if: always()
        run: docker compose down -v
