name: Verify HW5 test cleanup

on:
  push:
    branches: [hw-5]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hw-5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --python 3.13 --frozen
      - run: cp .env.example .env
      - run: uv run ruff check tests/test_purchase_events.py tests/test_monitoring_kafka.py tests/test_monitoring_processing.py tests/test_monitoring_websocket.py
      - run: uv run ruff format --diff tests/test_monitoring_websocket.py
