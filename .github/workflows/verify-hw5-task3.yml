name: Verify HW5 task 3

on:
  push:
    branches:
      - hw-5
    paths:
      - .github/workflows/verify-hw5-task3.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hw-5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv lock --python 3.13
      - run: uv sync --python 3.13 --frozen
      - run: cp .env.example .env
      - run: >-
          uv run ruff check
          app/infrastructure/kafka.py
          app/services/purchase_generator.py
          app/main.py
          tests/test_kafka_publisher.py
          tests/test_purchase_generator.py
      - run: >-
          uv run ruff format --check
          app/infrastructure/kafka.py
          app/services/purchase_generator.py
          app/main.py
          tests/test_kafka_publisher.py
          tests/test_purchase_generator.py
      - run: uv run pytest tests/test_kafka_publisher.py tests/test_purchase_generator.py
      - run: uv run pytest
      - run: docker compose config --quiet
      - name: Start Kafka publication stack
        run: |
          if ! docker compose up -d --build db redis kafka payment-api protection-api migrate app monitoring; then
            docker compose ps -a
            docker compose logs db redis kafka payment-api protection-api migrate app monitoring
            exit 1
          fi
      - name: Check main and monitoring startup
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null \
              && curl --fail --silent http://127.0.0.1:8001/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs app monitoring kafka
          exit 1
      - name: Verify tickets.purchased messages
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server kafka:19092 \
            --topic tickets.purchased \
            --from-beginning \
            --max-messages 3 \
            --timeout-ms 10000 > /tmp/purchases.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          messages = [json.loads(line) for line in Path('/tmp/purchases.jsonl').read_text().splitlines() if line.strip()]
          assert len(messages) == 3, messages
          required = {'payment_id', 'event_id', 'tickets_count', 'total_amount', 'paid_at'}
          for message in messages:
              assert set(message) == required, message
              assert 1 <= message['event_id'] <= 5, message
              assert message['tickets_count'] > 0, message
              assert message['total_amount'] > 0, message
          PY
      - name: Stop stack
        if: always()
        run: docker compose down -v
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "update lockfile for shared aiokafka dependency"
          git push origin HEAD:hw-5
