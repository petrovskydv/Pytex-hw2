name: Verify Kafka partition key

on:
  push:
    branches: [hw-5]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hw-5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --python 3.13 --frozen
      - run: uv run ruff check app/infrastructure/kafka.py tests/test_purchase_events.py
      - run: uv run ruff format --check app/infrastructure/kafka.py tests/test_purchase_events.py
      - run: uv run pytest tests/test_purchase_events.py
      - run: uv run pytest
      - run: cp .env.example .env
      - name: Start Kafka and create topic
        run: |
          docker compose up -d kafka kafka-init
          docker compose wait kafka-init
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq kafka-init))" = "0"
      - name: Verify same event id uses same Kafka partition
        run: |
          uv run python - <<'PY'
          import asyncio
          from datetime import UTC, datetime
          from uuid import uuid4

          from aiokafka import AIOKafkaConsumer

          from app.config import KafkaSettings
          from app.domain.dto import TicketPurchasedEvent
          from app.infrastructure.kafka import KafkaPurchasePublisher

          async def main() -> None:
              consumer = AIOKafkaConsumer(
                  "tickets.purchased",
                  bootstrap_servers="localhost:9092",
                  auto_offset_reset="earliest",
                  enable_auto_commit=False,
                  group_id=f"verify-key-{uuid4()}",
              )
              publisher = KafkaPurchasePublisher(
                  KafkaSettings(
                      bootstrap_servers="localhost:9092",
                      topic="tickets.purchased",
                      linger_ms=75,
                  )
              )
              await consumer.start()
              await publisher.start()
              try:
                  for _ in range(2):
                      await publisher.publish(
                          TicketPurchasedEvent(
                              payment_id=uuid4(),
                              event_id=3,
                              tickets_count=1,
                              total_amount=1000,
                              paid_at=datetime.now(UTC),
                          )
                      )
                  await publisher.stop()

                  records = []
                  deadline = asyncio.get_running_loop().time() + 10
                  while len(records) < 2 and asyncio.get_running_loop().time() < deadline:
                      batches = await consumer.getmany(timeout_ms=500, max_records=10)
                      records.extend(record for batch in batches.values() for record in batch)

                  assert len(records) >= 2
                  records = records[:2]
                  assert {record.key for record in records} == {b"3"}
                  assert len({record.partition for record in records}) == 1
              finally:
                  await publisher.stop()
                  await consumer.stop()

          asyncio.run(main())
          PY
      - name: Start full stack
        run: docker compose up -d --build
      - name: Wait for APIs
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null && curl --fail --silent http://127.0.0.1:8001/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs app monitoring kafka kafka-init migrate
          exit 1
      - name: Verify live monitoring pipeline
        run: |
          uv run python - <<'PY'
          import asyncio
          import json
          import websockets

          async def main() -> None:
              async with websockets.connect("ws://127.0.0.1:8001/ws/payments") as websocket:
                  payload = json.loads(await asyncio.wait_for(websocket.recv(), timeout=10))
              assert payload["type"] == "payment_activity"
              assert payload["items"]

          asyncio.run(main())
          PY
      - name: Stop stack
        if: always()
        run: docker compose down -v
