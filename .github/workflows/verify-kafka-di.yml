name: Verify Kafka dependency injection

on:
  push:
    branches: [hw-5]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hw-5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --python 3.13 --frozen
      - run: cp .env.example .env
      - name: Verify broker ownership
        run: |
          ! grep -q 'KafkaBroker(' app/infrastructure/kafka.py
          ! grep -q 'KafkaBroker(' monitoring/infrastructure/kafka.py
          grep -q 'KafkaBroker(' app/main.py
          grep -q 'KafkaBroker(' monitoring/main.py
      - run: uv run ruff check app/infrastructure/kafka.py app/main.py monitoring/infrastructure/kafka.py monitoring/main.py tests/test_purchase_events.py tests/test_monitoring_kafka.py
      - run: uv run ruff format --check app/infrastructure/kafka.py app/main.py monitoring/infrastructure/kafka.py monitoring/main.py tests/test_purchase_events.py tests/test_monitoring_kafka.py
      - run: uv run pytest tests/test_purchase_events.py tests/test_monitoring_kafka.py tests/test_monitoring_processing.py tests/test_monitoring_websocket.py
      - run: uv run pytest
      - run: docker compose config --quiet
      - name: Start full stack
        run: docker compose up -d --build
      - name: Wait for APIs
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null && curl --fail --silent http://127.0.0.1:8001/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs app monitoring kafka kafka-init migrate
          exit 1
      - name: Verify live monitoring pipeline
        run: |
          uv run python - <<'PY'
          import asyncio
          import json
          import websockets

          async def main() -> None:
              async with websockets.connect("ws://127.0.0.1:8001/ws/payments") as websocket:
                  payload = json.loads(await asyncio.wait_for(websocket.recv(), timeout=10))
              assert payload["type"] == "payment_activity"
              assert payload["items"]

          asyncio.run(main())
          PY
      - name: Verify monitoring persistence
        run: |
          rows=$(docker compose exec -T db psql -U postgres -d postgres -tAc 'select count(*) from event_payment_activity')
          test "$rows" -gt 0
      - name: Stop stack
        if: always()
        run: docker compose down -v
