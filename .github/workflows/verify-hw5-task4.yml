name: Verify HW5 task 4

on:
  push:
    branches:
      - hw-5
    paths:
      - .github/workflows/verify-hw5-task4.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hw-5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --python 3.13 --frozen
      - run: cp .env.example .env
      - run: >-
          uv run ruff check
          monitoring/config.py
          monitoring/infrastructure/kafka.py
          monitoring/services
          monitoring/main.py
          tests/test_monitoring_service.py
          tests/test_monitoring_kafka_batches.py
      - run: >-
          uv run ruff format --check
          monitoring/config.py
          monitoring/infrastructure/kafka.py
          monitoring/services
          monitoring/main.py
          tests/test_monitoring_service.py
          tests/test_monitoring_kafka_batches.py
      - run: uv run pytest tests/test_monitoring_service.py tests/test_monitoring_kafka_batches.py
      - run: uv run pytest
      - run: docker compose config --quiet
      - name: Start Kafka
        run: docker compose up -d kafka
      - name: Wait for Kafka
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs kafka
          exit 1
      - name: Verify real Kafka batching
        run: |
          uv run python - <<'PY'
          import asyncio
          from datetime import UTC, datetime
          from uuid import uuid4

          from aiokafka import AIOKafkaProducer

          from app.domain.dto import TicketPurchasedEvent
          from monitoring.config import KafkaSettings
          from monitoring.infrastructure.kafka import MonitoringKafka


          async def publish(topic: str, count: int) -> None:
              producer = AIOKafkaProducer(bootstrap_servers="localhost:9092")
              await producer.start()
              try:
                  for event_id in range(1, count + 1):
                      event = TicketPurchasedEvent(
                          payment_id=uuid4(),
                          event_id=event_id,
                          tickets_count=1,
                          total_amount=1000,
                          paid_at=datetime.now(UTC),
                      )
                      await producer.send_and_wait(topic, event.model_dump_json().encode())
              finally:
                  await producer.stop()


          async def receive_one_batch(topic: str, group: str) -> tuple[list[TicketPurchasedEvent], float]:
              loop = asyncio.get_running_loop()
              received = loop.create_future()

              async def handler(batch: list[TicketPurchasedEvent]) -> None:
                  if not received.done():
                      received.set_result((batch, loop.time()))

              consumer = MonitoringKafka(
                  KafkaSettings(
                      bootstrap_servers="localhost:9092",
                      topic=topic,
                      consumer_group=group,
                      max_records=10,
                      batch_timeout_ms=500,
                  ),
                  batch_handler=handler,
              )
              await consumer.start()
              started_at = loop.time()
              try:
                  batch, handled_at = await asyncio.wait_for(received, timeout=2)
                  return batch, handled_at - started_at
              finally:
                  await consumer.stop()


          async def main() -> None:
              full_topic = "tickets.purchased.task4.full"
              partial_topic = "tickets.purchased.task4.partial"

              await publish(full_topic, 10)
              full_batch, full_elapsed = await receive_one_batch(full_topic, "task4-full")
              assert len(full_batch) == 10, len(full_batch)
              assert full_elapsed < 0.5, full_elapsed

              await publish(partial_topic, 6)
              partial_batch, partial_elapsed = await receive_one_batch(partial_topic, "task4-partial")
              assert len(partial_batch) == 6, len(partial_batch)
              assert 0.35 <= partial_elapsed <= 1.2, partial_elapsed

              print(f"full_batch={len(full_batch)}, elapsed={full_elapsed:.3f}s")
              print(f"partial_batch={len(partial_batch)}, elapsed={partial_elapsed:.3f}s")


          asyncio.run(main())
          PY
      - name: Start application stack
        run: |
          if ! docker compose up -d --build db redis kafka payment-api protection-api migrate app monitoring; then
            docker compose ps -a
            docker compose logs db redis kafka payment-api protection-api migrate app monitoring
            exit 1
          fi
      - name: Check services
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null \
              && curl --fail --silent http://127.0.0.1:8001/openapi.json >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs app monitoring kafka
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose down -v
