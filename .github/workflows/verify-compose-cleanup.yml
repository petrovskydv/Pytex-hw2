name: Verify Compose cleanup

on:
  push:
    branches: [hw-5]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hw-5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --python 3.13 --frozen
      - run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Verify producer and consumer settings are separated
        run: |
          docker compose config > /tmp/compose.yml
          python - <<'PY'
          import yaml

          with open('/tmp/compose.yml', encoding='utf-8') as file:
              config = yaml.safe_load(file)

          app_env = config['services']['app']['environment']
          monitoring_env = config['services']['monitoring']['environment']

          for key in ('KAFKA__CONSUMER_GROUP', 'KAFKA__MAX_RECORDS', 'KAFKA__BATCH_TIMEOUT_MS'):
              assert key not in app_env, key
              assert key in monitoring_env, key
          assert monitoring_env['WEBSOCKET__SEND_TIMEOUT_SECONDS'] == '2'
          PY
      - run: uv run pytest
      - name: Start full application stack
        run: docker compose up -d --build
      - name: Wait for APIs
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null && curl --fail --silent http://127.0.0.1:8001/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs app monitoring kafka migrate worker-reports worker-cleanup worker-insurance scheduler
          exit 1
      - name: Verify WebSocket delivery
        run: |
          uv run python - <<'PY'
          import asyncio
          import json
          import websockets

          async def main() -> None:
              async with websockets.connect('ws://127.0.0.1:8001/ws/payments') as websocket:
                  payload = json.loads(await asyncio.wait_for(websocket.recv(), timeout=10))
              assert payload['type'] == 'payment_activity'
              assert payload['items']

          asyncio.run(main())
          PY
      - name: Stop stack
        if: always()
        run: docker compose down -v
