name: Verify HW5 task 2

on:
  push:
    branches:
      - hw-5

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hw-5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --python 3.13 --frozen
      - run: cp .env.example .env
      - run: >-
          uv run ruff check
          app/services/purchase_generator.py
          app/domain/dto.py
          app/config.py
          app/main.py
          tests/test_purchase_generator.py
      - run: >-
          uv run ruff format --check
          app/services/purchase_generator.py
          app/domain/dto.py
          app/config.py
          app/main.py
          tests/test_purchase_generator.py
      - run: uv run pytest tests/test_purchase_generator.py
      - run: uv run pytest
      - run: docker compose config --quiet
      - name: Start main application stack
        run: |
          if ! docker compose up -d --build db redis payment-api protection-api migrate app; then
            docker compose ps -a
            docker compose logs db redis payment-api protection-api migrate app
            exit 1
          fi
      - name: Check main HTTP startup
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs db redis payment-api protection-api migrate app
          exit 1
      - name: Show service state
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down -v
